name: FinanceFlow
options:
  bundleIdPrefix: com.financeflow
  deploymentTarget:
    iOS: "17.0"
targets:
  FinanceFlow:
    type: application
    platform: iOS
    sources:
      - path: FinanceFlow
      - path: Sources/FinanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financeflow.app
        INFOPLIST_KEY_CFBundleDisplayName: FinanceFlow
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
